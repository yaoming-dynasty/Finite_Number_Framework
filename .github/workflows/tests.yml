
name: FNF Reasoning Adapter Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install numpy pytest

      - name: Verify adapter import
        env:
          PYTHONPATH: src
        run: |
          python -c "import fnf; print('Package:', fnf.__file__)"
          python -c "from fnf import ReasoningAdapter; print('Adapter import OK:', ReasoningAdapter.__name__)"

      - name: Run reasoning adapter tests
        env:
          PYTHONPATH: src
        run: python -m pytest -v tests/test_reasoning_adapter.py
