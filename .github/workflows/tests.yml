
name: FNF Reasoning Adapter Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install numpy pytest

      - name: Run reasoning adapter tests
        env:
          PYTHONPATH: src
        run: python -m pytest -v tests/test_reasoning_adapter.py
