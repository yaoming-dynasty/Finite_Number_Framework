name: FNF Reasoning Adapter Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install numpy pytest

      - name: Diagnose Python package resolution
        env:
          PYTHONPATH: src
        run: |
          set +e

          echo "=== Working directory ==="
          pwd

          echo "=== Git checkout ==="
          git rev-parse --show-toplevel
          git branch --show-current

          echo "=== Package files ==="
          ls -la src
          ls -la src/fnf
          find src/fnf -maxdepth 2 -type f -print

          echo "=== Python environment ==="
          python --version
          python -c "import os, sys; print('PYTHONPATH:', os.environ.get('PYTHONPATH')); print('sys.path:', sys.path)"

          echo "=== Resolve fnf ==="
          python -c "import importlib.util; s = importlib.util.find_spec('fnf'); print('spec:', s); print('origin:', s.origin if s else None); print('locations:', list(s.submodule_search_locations or []) if s else None)"

          echo "=== Import adapter module ==="
          python -c "from fnf.reasoning_adapter import ReasoningAdapter; print(ReasoningAdapter)"

          echo "=== Import package export ==="
          python -c "from fnf import ReasoningAdapter; print(ReasoningAdapter)"

      - name: Run reasoning adapter tests
        env:
          PYTHONPATH: src
        run: python -m pytest -v tests/test_reasoning_adapter.py
